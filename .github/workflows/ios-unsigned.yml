name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the IPA (defaults to the newest release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Build unsigned IPA
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NODE_ENV: production
      IPA_NAME: kinsay-ios-unsigned.ipa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned device application
        run: |
          xcodebuild \
            -workspace ios/Kinsay.xcworkspace \
            -scheme Kinsay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and inspect IPA
        run: |
          app_path="build/ios-derived/Build/Products/Release-iphoneos/Kinsay.app"
          test -d "$app_path"

          mkdir -p release-artifact/Payload
          ditto "$app_path" release-artifact/Payload/Kinsay.app
          (
            cd release-artifact
            ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
            rm -rf Payload
          )

          unzip -t "release-artifact/$IPA_NAME"
          unzip -l "release-artifact/$IPA_NAME" | grep 'Payload/Kinsay.app/Info.plist'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinsay-ios-unsigned
          path: release-artifact/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          release_tag="$REQUESTED_TAG"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi

          if [[ -z "$release_tag" ]]; then
            release_tag="kinsay-ios-build-$GITHUB_RUN_NUMBER"
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "Kinsay iOS build #$GITHUB_RUN_NUMBER" \
              --notes "Unsigned Kinsay iOS build for local signing with SideStore or Sideloadly." \
              --prerelease
          fi

          gh release upload "$release_tag" "release-artifact/$IPA_NAME" --clobber
          echo "Published $IPA_NAME to release $release_tag"
