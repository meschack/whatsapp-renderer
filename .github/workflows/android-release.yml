name: Kinsay release builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kinsay-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: kinsay-armeabi-v7a
            architectures: armeabi-v7a
            task: assembleRelease
            extension: apk
            output: android/app/build/outputs/apk/release/app-release.apk
          - artifact: kinsay-arm64-v8a
            architectures: arm64-v8a
            task: assembleRelease
            extension: apk
            output: android/app/build/outputs/apk/release/app-release.apk
          - artifact: kinsay-universal-arm
            architectures: armeabi-v7a,arm64-v8a
            task: assembleRelease
            extension: apk
            output: android/app/build/outputs/apk/release/app-release.apk
          - artifact: kinsay-play-store
            architectures: armeabi-v7a,arm64-v8a
            task: bundleRelease
            extension: aab
            output: android/app/build/outputs/bundle/release/app-release.aab

    env:
      NODE_ENV: production
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release
        working-directory: android
        run: ./gradlew -I ../scripts/android-release-signing.gradle :app:${{ matrix.task }} -PreactNativeArchitectures=${{ matrix.architectures }} --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p release-artifact
          cp "${{ matrix.output }}" "release-artifact/${{ matrix.artifact }}.${{ matrix.extension }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact/${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build unsigned IPA
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NODE_ENV: production
      IPA_NAME: kinsay-ios-unsigned.ipa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned device application
        run: |
          xcodebuild \
            -workspace ios/Kinsay.xcworkspace \
            -scheme Kinsay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and inspect IPA
        run: |
          app_path="build/ios-derived/Build/Products/Release-iphoneos/Kinsay.app"
          test -d "$app_path"

          mkdir -p release-artifact/Payload
          ditto "$app_path" release-artifact/Payload/Kinsay.app
          (
            cd release-artifact
            ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
            rm -rf Payload
          )

          unzip -t "release-artifact/$IPA_NAME"
          unzip -l "release-artifact/$IPA_NAME" | grep 'Payload/Kinsay.app/Info.plist'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinsay-ios-unsigned
          path: release-artifact/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release builds
        uses: actions/download-artifact@v4
        with:
          pattern: kinsay-*
          path: release-assets
          merge-multiple: true

      - name: Select release identity
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=Kinsay $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=kinsay-build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "title=Kinsay build #$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes "Android and unsigned iOS builds generated by CI. Use the universal ARM APK for normal Android installation. The AAB is intended for Play Store distribution, while the IPA must be signed locally with SideStore or Sideloadly."
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
